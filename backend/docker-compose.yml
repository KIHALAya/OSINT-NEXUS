version: "3.9"

services:
  api:
    build: .
    container_name: nexus-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  db:
      image: postgres:15
      container_name: nexus-db
      environment:
        POSTGRES_USER: nexus
        POSTGRES_PASSWORD: nexus
        POSTGRES_DB: nexus
      ports:
        - "5432:5432"

  redis:
      image: redis:7
      container_name: nexus-redis
      ports:
        - "6379:6379"

  qdrant:
      image: qdrant/qdrant:latest
      container_name: nexus-qdrant
      ports:
        - "6333:6333"   # REST API
        - "6334:6334"   # gRPC (optional)
      volumes:
        - qdrant_data:/qdrant/storage

volumes:
    qdrant_data:  